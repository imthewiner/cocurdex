appId: dev.cocurdex.mobile
---
- launchApp
- extendedWaitUntil:
    visible: ${EMPTY_TITLE}
    timeout: 30000
- openLink: ${PAIR_DEEP_LINK}
- tapOn:
    text: ${SYSTEM_OPEN}
    optional: true
- extendedWaitUntil:
    visible:
      text: ${PAIR_ACTION}
      enabled: true
    timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - tapOn: ${PAIR_ACTION}
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 15000

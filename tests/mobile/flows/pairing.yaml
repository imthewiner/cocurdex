appId: dev.cocurdex.mobile
---
- launchApp
- assertVisible: ${EMPTY_TITLE}
- takeScreenshot: empty
- tapOn:
    text: ${EMPTY_PAIR}
    retryTapIfNoChange: true
- tapOn:
    text: ${SYSTEM_CONTINUE}
    optional: true
- tapOn:
    id: "pairing-link"
- inputText: ${PAIRING_LINK}
- takeScreenshot: pairing-sheet
- tapOn: ${PAIR_ACTION}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 15000
- assertNotVisible: ${LINK_PLACEHOLDER}
- takeScreenshot: sessions
- tapOn: ${SEARCH_PLACEHOLDER}
- inputText: ${SEARCH_QUERY}
- extendedWaitUntil:
    visible: ${SEARCHED_SESSION_TITLE}
    timeout: 5000
- assertNotVisible: ${OTHER_SESSION_TITLE}
- takeScreenshot: sessions-search
- tapOn: ${TAB_COMPUTERS}
- assertVisible: ${HOST_ADDRESS}
- takeScreenshot: paired

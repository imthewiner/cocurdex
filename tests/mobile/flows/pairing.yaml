    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ${ISSUE_LINK_TEXT}
          timeout: 10000
          optional: true
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  notVisible: ${ISSUE_LINK_TEXT}
                commands:
                  - back
                  - tapOn: ${LINK_NOTE_TITLE}

                visible: ${SEARCHED_SESSION_TITLE}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- tapOn: ${SEARCH_DISMISS}
- extendedWaitUntil:
    visible: "${ROLE_NAME}[ ·,].*"
    timeout: 5000
- scrollUntilVisible:
    element:
      text: ${SHOW_MORE}
    centerElement: true
    optional: true
- tapOn:
    text: ${SHOW_MORE}
    optional: true
- scrollUntilVisible:
    element: ${OTHER_SESSION_TITLE}
    timeout: 10000
- scrollUntilVisible:
    element: ${SEARCHED_SESSION_TITLE}
    direction: UP
    timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_ISSUES}
      - extendedWaitUntil:
          visible: ${IN_PROGRESS_ISSUE_TITLE}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: issues
- tapOn: ${NEW_ISSUE_ACTION}
- extendedWaitUntil:

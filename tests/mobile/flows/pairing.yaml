appId: dev.cocurdex.mobile
---
- launchApp
- assertVisible: ${EMPTY_TITLE}
- takeScreenshot: empty
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${EMPTY_SCAN}
      - extendedWaitUntil:
          visible: ${SCAN_TITLE}
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: scan
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SCAN_PASTE}
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - extendedWaitUntil:
          visible:
            id: "pairing-link"
          timeout: 5000
- tapOn:
    id: "pairing-link"
- inputText: ${PAIRING_LINK}
- takeScreenshot: pairing-sheet
- tapOn: ${PAIR_ACTION}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 15000
- assertNotVisible: ${LINK_PLACEHOLDER}
- takeScreenshot: sessions
- scrollUntilVisible:
    element: ${CODE_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${CODE_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${CODE_BLOCK_TEXT}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-code-block
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${SEND_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SEND_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 10000
- assertVisible: ${ATTACH_ACTION}
- tapOn:
    id: "composer-input"
- inputText: ${SEND_PROMPT}
- tapOn: ${SEND_ACTION}
- extendedWaitUntil:
    visible: ${SEND_REPLY}
    timeout: 20000
- assertVisible: ${SEND_PROMPT}
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: session-reply
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          while:
            visible:
              id: "composer-input"
          times: 2
          commands:
            - back
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${SEARCH_PLACEHOLDER}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: ".*search_button"
- inputText: ${SEARCH_QUERY}
- extendedWaitUntil:
    visible: ${SEARCHED_SESSION_TITLE}
    timeout: 5000
- assertNotVisible: ${OTHER_SESSION_TITLE}
- waitForAnimationToEnd
- takeScreenshot: sessions-search
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SEARCHED_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${SEARCHED_SESSION_LAST_PROMPT}
          timeout: 10000
- assertVisible:
    id: "composer-input"
- assertNotVisible: ${TAB_COMPUTERS}
- waitForAnimationToEnd
- takeScreenshot: session-detail
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_COMPUTERS}
      - extendedWaitUntil:
          visible: ${HOST_ADDRESS}
          timeout: 5000
- takeScreenshot: paired

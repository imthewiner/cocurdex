    direction: UP
    speed: 90
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "mermaid-diagram"
    direction: UP
    visibilityPercentage: 40
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-mermaid
- tapOn:
    id: "mermaid-diagram"
- extendedWaitUntil:
    visible:
      id: "mermaid-viewer"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: mermaid-viewer
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${DIAGRAM_CLOSE}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${DIAGRAM_HEADING}
    timeout: 5000
- assertVisible:
    id: "mermaid-diagram"
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:

appId: dev.cocurdex.mobile
---
- launchApp
- assertVisible: ${EMPTY_TITLE}
- takeScreenshot: empty
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${EMPTY_SCAN}
      - extendedWaitUntil:
          visible: ${SCAN_TITLE}
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: scan
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ${SCAN_UNREACHABLE}
          timeout: 15000
      - takeScreenshot: scan-unreachable
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SCAN_PASTE}
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - extendedWaitUntil:
          visible:
            id: "pairing-link"
          timeout: 5000
- tapOn:
    id: "pairing-link"
- inputText: ${PAIRING_LINK}
- takeScreenshot: pairing-sheet
- extendedWaitUntil:
    visible:
      text: ${PAIR_ACTION}
      enabled: true
    timeout: 5000
- tapOn: ${PAIR_ACTION}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 15000
- assertNotVisible: ${LINK_PLACEHOLDER}
- takeScreenshot: sessions
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${LIST_OPTIONS_ACTION}
      - extendedWaitUntil:
          visible:
            id: list-option-statuses
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: list-options
- tapOn:
    id: list-option-grouping
- tapOn:
    id: list-choice-none
- extendedWaitUntil:
    visible:
      id: list-option-grouping
    timeout: 5000
- tapOn:
    id: list-option-grouping
- tapOn:
    id: list-choice-workspace
- extendedWaitUntil:
    visible:
      id: list-option-grouping
    timeout: 5000
- tapOn: ${LIST_OPTIONS_DONE}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 5000
- scrollUntilVisible:
    element:
      text: ${SHOW_MORE}
    optional: true
- tapOn:
    text: ${SHOW_MORE}
    optional: true
- scrollUntilVisible:
    element: ${WORKSPACE_NAME}
    direction: UP
- scrollUntilVisible:
    element: ${CODE_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${CODE_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${CODE_BLOCK_TEXT}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-code-block
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${TOOL_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TOOL_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "transcript-activity-.*"
          timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "transcript-activity-.*"
      - extendedWaitUntil:
          visible:
            id: "transcript-tool-.*"
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "transcript-tool-.*"
      - extendedWaitUntil:
          visible:
            id: "tool-call-input"
          timeout: 5000
- assertVisible: ${TOOL_INPUT_TITLE}
- waitForAnimationToEnd
- takeScreenshot: tool-call
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                point: 5%, 9%
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - extendedWaitUntil:
          visible:
            id: "transcript-tool-.*"
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: ${FILE_LINK_TEXT}
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                text: ${FILE_LINK_TEXT}
                point: 8%, 90%
      - extendedWaitUntil:
          visible: ${FILE_SOURCE_TEXT}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: file-source
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: 5%, 9%
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "transcript-tool-.*"
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${DIAGRAM_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${DIAGRAM_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 10000
- scrollUntilVisible:
    element: ${DIAGRAM_HEADING}
    direction: UP
    speed: 90
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "mermaid-diagram"
    direction: UP
    visibilityPercentage: 40
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-mermaid
- tapOn:
    id: "mermaid-diagram"
- extendedWaitUntil:
    visible:
      id: "mermaid-viewer"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: mermaid-viewer
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${DIAGRAM_CLOSE}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${DIAGRAM_HEADING}
    timeout: 5000
- assertVisible:
    id: "mermaid-diagram"
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${IMAGE_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${IMAGE_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${IMAGE_NAME}
          timeout: 10000
- tapOn: ${IMAGE_NAME}
- extendedWaitUntil:
    visible:
      id: "image-viewer"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: image-viewer
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${IMAGE_CLOSE}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${IMAGE_NAME}
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${SEND_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SEND_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 10000
- assertVisible: ${ATTACH_ACTION}
- tapOn:
    id: "composer-input"
- inputText: ${SEND_PROMPT}
- tapOn: ${SEND_ACTION}
- extendedWaitUntil:
    visible: ${SEND_REPLY}
    timeout: 20000
- takeScreenshot: session-streaming
- extendedWaitUntil:
    visible: ${SEND_REPLY_END}
    timeout: 20000
- assertVisible: ${SEND_REPLY_CODE}
- assertVisible: ${SEND_PROMPT}
- tapOn: ${SEND_REPLY}
- waitForAnimationToEnd
- takeScreenshot: session-reply
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          while:
            visible:
              id: "composer-input"
          times: 2
          commands:
            - back
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${NEW_SESSION_ACTION}
      - extendedWaitUntil:
          visible:
            id: "new-session-prompt"
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-session
- tapOn:
    text: ${WORKSPACE_NAME}
    childOf:
      id: "new-session-workspace"
- extendedWaitUntil:
    visible:
      id: "workspace-choice-.*"
    timeout: 5000
- tapOn:
    id: "workspace-choice-.*"
- extendedWaitUntil:
    visible:
      id: "new-session-prompt"
    timeout: 5000
- tapOn:
    id: "new-session-agent"
- extendedWaitUntil:
    visible: ${NEW_SESSION_AGENT}
    timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${NEW_SESSION_AGENT}
      - extendedWaitUntil:
          visible: ${NEW_SESSION_MODEL}
          timeout: 5000
- tapOn: ${NEW_SESSION_MODEL}
- tapOn:
    id: "new-session-role-${ROLE_ID}"
- waitForAnimationToEnd
- takeScreenshot: new-session-agent
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${NEW_SESSION_TITLE}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "new-session-prompt"
    timeout: 5000
- assertVisible:
    text: ${ROLE_NAME}
    childOf:
      id: "new-session-agent"
- tapOn:
    id: "new-session-prompt"
- inputText: ${NEW_SESSION_PROMPT}
- takeScreenshot: new-session-filled
- tapOn: ${SEND_ACTION}
- extendedWaitUntil:
    visible: ${SEND_REPLY}
    timeout: 20000
- assertVisible: ${NEW_SESSION_PROMPT}
- waitForAnimationToEnd
- takeScreenshot: new-session-reply
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${SEARCH_PLACEHOLDER}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: ".*search_button"
- inputText: ${SEARCH_QUERY}
- extendedWaitUntil:
    visible: ${SEARCHED_SESSION_TITLE}
    timeout: 5000
- assertNotVisible: ${OTHER_SESSION_TITLE}
- waitForAnimationToEnd
- takeScreenshot: sessions-search
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SEARCHED_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${SEARCHED_SESSION_LAST_PROMPT}
          timeout: 10000
- assertVisible:
    id: "composer-input"
- assertNotVisible: ${TAB_COMPUTERS}
- waitForAnimationToEnd
- takeScreenshot: session-detail
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${SEARCHED_SESSION_TITLE}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${SEARCH_DISMISS}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: "${ROLE_NAME}[ ·,].*"
    timeout: 5000
- scrollUntilVisible:
    element: ${OTHER_SESSION_TITLE}
    timeout: 10000
- scrollUntilVisible:
    element: ${SEARCHED_SESSION_TITLE}
    direction: UP
    timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_ISSUES}
      - extendedWaitUntil:
          visible: ${IN_PROGRESS_ISSUE_TITLE}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: issues
- tapOn: ${NEW_ISSUE_ACTION}
- tapOn:
    id: new-issue-title
- inputText: ${NEW_ISSUE_TITLE}
- waitForAnimationToEnd
- takeScreenshot: new-issue
- tapOn: ${NEW_ISSUE_SUBMIT}
- extendedWaitUntil:
    visible: ${NEW_ISSUE_TITLE}
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${TAB_ISSUES}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${NEW_ISSUE_TITLE}
    timeout: 10000
- tapOn: ${ISSUE_TITLE}
- extendedWaitUntil:
    visible: ${ISSUE_DESCRIPTION}
    timeout: 10000
- assertVisible: ${ISSUE_SESSION_TITLE}
- extendedWaitUntil:
    visible:
      id: "doc-image"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: issue-detail
- tapOn:
    id: "doc-image"
- extendedWaitUntil:
    visible:
      id: "image-viewer"
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${IMAGE_CLOSE}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${ISSUE_DESCRIPTION}
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${TAB_ISSUES}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${IN_PROGRESS_ISSUE_TITLE}
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_NOTES}
      - extendedWaitUntil:
          visible: ${NOTE_PARENT_TITLE}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: notes
- tapOn: ${NEW_NOTE_ACTION}
- tapOn:
    id: new-note-title
- inputText: ${NEW_NOTE_TITLE}
- tapOn:
    id: new-note-body
- inputText: ${NEW_NOTE_BODY}
- waitForAnimationToEnd
- takeScreenshot: new-note
- tapOn: ${NEW_NOTE_SUBMIT}
- extendedWaitUntil:
    visible: ${NEW_NOTE_BODY}
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${TAB_NOTES}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${NEW_NOTE_TITLE}
    timeout: 10000
- tapOn: ${NOTE_TITLE}
- extendedWaitUntil:
    visible: ${NOTE_BODY_TEXT}
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: note-detail
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${TAB_NOTES}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- tapOn: ${LINK_NOTE_TITLE}
- tapOn: ${ISSUE_LINK_TEXT}
- extendedWaitUntil:
    visible: ${ISSUE_DESCRIPTION}
    timeout: 10000
- takeScreenshot: note-issue-link
- scrollUntilVisible:
    element: ${LINK_NOTE_TITLE}
    direction: DOWN
    timeout: 10000
- tapOn: ${LINK_NOTE_TITLE}
- extendedWaitUntil:
    visible: ${ISSUE_LINK_TEXT}
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                point: 5%, 9%
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - extendedWaitUntil:
          visible: ${NOTE_PARENT_TITLE}
          timeout: 3000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_COMPUTERS}
      - extendedWaitUntil:
          visible: ".*${HOST_ADDRESS}.*"
          timeout: 5000
- takeScreenshot: paired
- tapOn:
    id: "host-more-.*"
- extendedWaitUntil:
    visible:
      id: computer-action-details
    timeout: 5000
- takeScreenshot: computer-actions
- tapOn:
    id: computer-action-details
- extendedWaitUntil:
    visible:
      id: computer-scope-read
    timeout: 5000
- takeScreenshot: computer-detail
- tapOn:
    id: computer-rename
- tapOn:
    id: rename-computer-name
- eraseText: 80
- inputText: ${RENAMED_COMPUTER}
- tapOn: ${RENAME_COMPUTER_SAVE}
- extendedWaitUntil:
    visible: ${RENAMED_COMPUTER}
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: 5%, 9%
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${RENAMED_COMPUTER}
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_SESSIONS}
      - extendedWaitUntil:
          visible: ${SEND_SESSION_TITLE}
          timeout: 5000
- tapOn: ".*${RENAMED_COMPUTER}.*"
- extendedWaitUntil:
    visible:
      id: host-switcher-pair
    timeout: 5000
- takeScreenshot: host-switcher
- tapOn:
    id: "host-switcher-(?!pair).*"
- extendedWaitUntil:
    notVisible:
      id: host-switcher-pair
    timeout: 5000
- longPressOn: ${SEND_SESSION_TITLE}
- extendedWaitUntil:
    visible:
      id: session-action-archive
    timeout: 5000
- takeScreenshot: session-actions
- tapOn:
    id: session-action-archive
- extendedWaitUntil:
    notVisible: ${SEND_SESSION_TITLE}
    timeout: 10000
- tapOn: ${TAB_COMPUTERS}
- tapOn: ${SETTINGS_ACTION}
- waitForAnimationToEnd
- takeScreenshot: settings
- tapOn:
    id: settings-archived
- extendedWaitUntil:
    visible: ${SEND_SESSION_TITLE}
    timeout: 10000
- takeScreenshot: archived
- tapOn: ${RESTORE_ACTION}
- extendedWaitUntil:
    notVisible: ${SEND_SESSION_TITLE}
    timeout: 10000

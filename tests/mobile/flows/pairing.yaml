appId: dev.cocurdex.mobile
---
- launchApp
- assertVisible: ${EMPTY_TITLE}
- takeScreenshot: empty
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${EMPTY_SCAN}
      - extendedWaitUntil:
          visible: ${SCAN_TITLE}
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: scan
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SCAN_PASTE}
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - extendedWaitUntil:
          visible:
            id: "pairing-link"
          timeout: 5000
- tapOn:
    id: "pairing-link"
- inputText: ${PAIRING_LINK}
- takeScreenshot: pairing-sheet
- tapOn: ${PAIR_ACTION}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 15000
- assertNotVisible: ${LINK_PLACEHOLDER}
- takeScreenshot: sessions
- scrollUntilVisible:
    element: ${CODE_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${CODE_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${CODE_BLOCK_TEXT}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-code-block
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${TOOL_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TOOL_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "transcript-tool-.*"
          timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "transcript-tool-.*"
      - extendedWaitUntil:
          visible:
            id: "tool-call-input"
          timeout: 5000
- assertVisible: ${TOOL_INPUT_TITLE}
- waitForAnimationToEnd
- takeScreenshot: tool-call
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 80%, 50%
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "transcript-tool-.*"
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${DIAGRAM_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${DIAGRAM_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 10000
- scrollUntilVisible:
    element: ${DIAGRAM_HEADING}
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "mermaid-diagram"
    direction: UP
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-mermaid
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${SEND_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SEND_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 10000
- assertVisible: ${ATTACH_ACTION}
- tapOn:
    id: "composer-input"
- inputText: ${SEND_PROMPT}
- tapOn: ${SEND_ACTION}
- extendedWaitUntil:
    visible: ${SEND_REPLY}
    timeout: 20000
- assertVisible: ${SEND_PROMPT}
- tapOn: ${SEND_REPLY}
- waitForAnimationToEnd
- takeScreenshot: session-reply
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          while:
            visible:
              id: "composer-input"
          times: 2
          commands:
            - back
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${NEW_SESSION_ACTION}
      - extendedWaitUntil:
          visible:
            id: "new-session-prompt"
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-session
- tapOn:
    id: "new-session-agent"
- extendedWaitUntil:
    visible: ${NEW_SESSION_AGENT}
    timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${NEW_SESSION_AGENT}
      - extendedWaitUntil:
          visible: ${NEW_SESSION_MODEL}
          timeout: 5000
- tapOn: ${NEW_SESSION_MODEL}
- waitForAnimationToEnd
- takeScreenshot: new-session-agent
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${NEW_SESSION_TITLE}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "new-session-prompt"
    timeout: 5000
- tapOn:
    id: "new-session-prompt"
- inputText: ${NEW_SESSION_PROMPT}
- takeScreenshot: new-session-filled
- tapOn: ${NEW_SESSION_START}
- extendedWaitUntil:
    visible: ${SEND_REPLY}
    timeout: 20000
- assertVisible: ${NEW_SESSION_PROMPT}
- waitForAnimationToEnd
- takeScreenshot: new-session-reply
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${SEARCH_PLACEHOLDER}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: ".*search_button"
- inputText: ${SEARCH_QUERY}
- extendedWaitUntil:
    visible: ${SEARCHED_SESSION_TITLE}
    timeout: 5000
- assertNotVisible: ${OTHER_SESSION_TITLE}
- waitForAnimationToEnd
- takeScreenshot: sessions-search
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SEARCHED_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${SEARCHED_SESSION_LAST_PROMPT}
          timeout: 10000
- assertVisible:
    id: "composer-input"
- assertNotVisible: ${TAB_COMPUTERS}
- waitForAnimationToEnd
- takeScreenshot: session-detail
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_ISSUES}
      - extendedWaitUntil:
          visible: ${IN_PROGRESS_ISSUE_TITLE}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: issues
- tapOn: ${ISSUE_TITLE}
- extendedWaitUntil:
    visible: ${ISSUE_DESCRIPTION}
    timeout: 10000
- assertVisible: ${ISSUE_SESSION_TITLE}
- waitForAnimationToEnd
- takeScreenshot: issue-detail
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${TAB_ISSUES}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${IN_PROGRESS_ISSUE_TITLE}
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_NOTES}
      - extendedWaitUntil:
          visible: ${NOTE_PARENT_TITLE}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: notes
- tapOn: ${NOTE_TITLE}
- extendedWaitUntil:
    visible: ${NOTE_BODY_TEXT}
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: note-detail
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${TAB_NOTES}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${NOTE_PARENT_TITLE}
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_COMPUTERS}
      - extendedWaitUntil:
          visible: ${HOST_ADDRESS}
          timeout: 5000
- takeScreenshot: paired

- takeScreenshot: computer-detail
- tapOn:
    id: computer-rename
- extendedWaitUntil:
    visible:
      id: rename-computer-name
    timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: rename-computer-name
            focused: true
          timeout: 5000
- eraseText: 80
- inputText: ${RENAMED_COMPUTER}
- tapOn: ${RENAME_COMPUTER_SAVE}
- extendedWaitUntil:
    visible: ${RENAMED_COMPUTER}
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: rename-computer-name
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 3
          commands:
            - waitForAnimationToEnd
            - tapOn:
                point: 5%, 9%
            - extendedWaitUntil:
                visible:
                  id: "host-row-.*"
                timeout: 3000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "host-row-.*"
    timeout: 5000
- assertVisible: ${RENAMED_COMPUTER}
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 3
          commands:
            - waitForAnimationToEnd
            - tapOn:
                point: 5%, 9%
            - extendedWaitUntil:
                visible:
                  id: settings-computers
                timeout: 3000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: settings-computers
    timeout: 5000
- assertVisible: ".*${RENAMED_COMPUTER}.*"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: ${TAB_SESSIONS}
          below:
            id: settings-archived
      - extendedWaitUntil:
          visible: ${SEND_SESSION_TITLE}
          timeout: 5000
- longPressOn: ${SEND_SESSION_TITLE}
- extendedWaitUntil:
    visible:
      id: session-action-archive
    timeout: 5000
- takeScreenshot: session-actions
- tapOn:
    id: session-action-archive
- extendedWaitUntil:
    notVisible: ${SEND_SESSION_TITLE}
    timeout: 10000
- tapOn: ${TAB_SETTINGS}
- waitForAnimationToEnd
- takeScreenshot: settings
- tapOn:
    id: settings-language
- extendedWaitUntil:
    visible:
      id: settings-language-zh-CN
    timeout: 5000
- assertVisible:
    id: settings-language-en-US
- takeScreenshot: settings-language
- tapOn:
    id: settings-language-system
- extendedWaitUntil:
    visible:
      id: settings-archived
    timeout: 5000
- tapOn:
    id: settings-archived
- extendedWaitUntil:
    visible: ${SEND_SESSION_TITLE}
    timeout: 10000
- takeScreenshot: archived
- tapOn: ${RESTORE_ACTION}
- extendedWaitUntil:
    notVisible: ${SEND_SESSION_TITLE}
    timeout: 10000

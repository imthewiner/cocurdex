appId: dev.cocurdex.mobile
---
- launchApp
- assertVisible: ${EMPTY_TITLE}
- takeScreenshot: empty
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${EMPTY_SCAN}
      - extendedWaitUntil:
          visible: ${SCAN_TITLE}
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: scan
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ${SCAN_UNREACHABLE}
          timeout: 15000
      - takeScreenshot: scan-unreachable
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SCAN_PASTE}
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - extendedWaitUntil:
          visible:
            id: "pairing-link"
          timeout: 5000
- tapOn:
    id: "pairing-link"
- inputText: ${PAIRING_LINK}
- extendedWaitUntil:
    visible:
      id: "pairing-link"
      text: ${PAIRING_LINK}
    timeout: 10000
- takeScreenshot: pairing-sheet
- extendedWaitUntil:
    visible:
      text: ${PAIR_ACTION}
      enabled: true
    timeout: 5000
- tapOn: ${PAIR_ACTION}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 30000
- assertNotVisible: ${LINK_PLACEHOLDER}
- takeScreenshot: sessions
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${LIST_OPTIONS_ACTION}
      - extendedWaitUntil:
          visible:
            id: list-option-statuses
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: list-options
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: list-option-grouping
      - extendedWaitUntil:
          visible:
            id: list-choice-none
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: list-choice-none
      - extendedWaitUntil:
          visible:
            id: list-option-grouping
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: list-option-grouping
      - extendedWaitUntil:
          visible:
            id: list-choice-workspace
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: list-choice-workspace
      - extendedWaitUntil:
          visible:
            id: list-option-grouping
          timeout: 5000
- tapOn: ${LIST_OPTIONS_DONE}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 5000
- scrollUntilVisible:
    element:
      text: ${SHOW_MORE}
    centerElement: true
    optional: true
- tapOn:
    text: ${SHOW_MORE}
    optional: true
- scrollUntilVisible:
    element: ${WORKSPACE_NAME}
    direction: UP
- scrollUntilVisible:
    element: ${CODE_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${CODE_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${CODE_BLOCK_TEXT}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-code-block
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${TOOL_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TOOL_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "transcript-activity-.*"
          timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "transcript-activity-.*"
      - extendedWaitUntil:
          visible:
            id: "transcript-tool-.*"
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "transcript-tool-.*"
      - extendedWaitUntil:
          visible:
            id: "tool-call-input"
          timeout: 5000
- assertVisible: ${TOOL_INPUT_TITLE}
- waitForAnimationToEnd
- takeScreenshot: tool-call
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                point: 5%, 9%
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - extendedWaitUntil:
          visible:
            id: "transcript-tool-.*"
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: ${FILE_LINK_TEXT}
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                text: ${FILE_LINK_TEXT}
                point: 8%, 90%
      - extendedWaitUntil:
          visible: ${FILE_SOURCE_TEXT}
          timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: source-horizontal-scroll
- takeScreenshot: file-source
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: 5%, 9%
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "transcript-tool-.*"
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${DIAGRAM_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${DIAGRAM_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 10000
- scrollUntilVisible:

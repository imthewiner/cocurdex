appId: dev.cocurdex.mobile
---
- launchApp
- assertVisible: ${EMPTY_TITLE}
- takeScreenshot: empty
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${EMPTY_SCAN}
      - extendedWaitUntil:
          visible: ${SCAN_TITLE}
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: scan
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ${SCAN_UNREACHABLE}
          timeout: 15000
      - takeScreenshot: scan-unreachable
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SCAN_PASTE}
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - extendedWaitUntil:
          visible:
            id: "pairing-link"
          timeout: 5000
- tapOn:
    id: "pairing-link"
- inputText: ${PAIRING_LINK}
- extendedWaitUntil:
    visible:
      id: "pairing-link"
      text: ${PAIRING_LINK}
    timeout: 10000
- takeScreenshot: pairing-sheet
- extendedWaitUntil:
    visible:
      text: ${PAIR_ACTION}
      enabled: true
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - tapOn: ${PAIR_ACTION}
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 15000
- assertNotVisible: ${LINK_PLACEHOLDER}
- takeScreenshot: sessions
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${LIST_OPTIONS_ACTION}
      - extendedWaitUntil:
          visible:
            id: list-option-statuses
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: list-options
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: list-option-grouping
      - extendedWaitUntil:
          visible:
            id: list-choice-none
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: list-choice-none
      - extendedWaitUntil:
          visible:
            id: list-option-grouping
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: list-option-grouping
      - extendedWaitUntil:
          visible:
            id: list-choice-workspace
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: list-choice-workspace
      - extendedWaitUntil:
          visible:
            id: list-option-grouping
          timeout: 5000
- tapOn: ${LIST_OPTIONS_CLOSE}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 5000
- scrollUntilVisible:
    element:
      text: ${SHOW_MORE}
    centerElement: true
    optional: true
- tapOn:
    text: ${SHOW_MORE}
    optional: true
- scrollUntilVisible:
    element: ${WORKSPACE_NAME}
    direction: UP
- scrollUntilVisible:
    element: ${CODE_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${CODE_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${CODE_BLOCK_TEXT}
          timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-code-block
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${TOOL_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TOOL_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "transcript-activity-.*"
          timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "transcript-activity-.*"
      - extendedWaitUntil:
          visible:
            id: "transcript-tool-.*"
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "transcript-tool-.*"
      - extendedWaitUntil:
          visible:
            id: "tool-call-input"
          timeout: 5000
- assertVisible: ${TOOL_INPUT_TITLE}
- waitForAnimationToEnd
- takeScreenshot: tool-call
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                point: 5%, 9%
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - extendedWaitUntil:
          visible:
            id: "transcript-tool-.*"
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: ${FILE_LINK_TEXT}
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                text: ${FILE_LINK_TEXT}
                point: 8%, 90%
      - extendedWaitUntil:
          visible: ${FILE_SOURCE_TEXT}
          timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: source-horizontal-scroll
- takeScreenshot: file-source
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: 5%, 9%
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "transcript-tool-.*"
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${DIAGRAM_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${DIAGRAM_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 10000
- scrollUntilVisible:
    element: ${DIAGRAM_HEADING}
    direction: UP
    speed: 90
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "mermaid-diagram"
    direction: UP
    visibilityPercentage: 40
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-mermaid
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible:
          element:
            id: "mermaid-diagram"
          direction: UP
          visibilityPercentage: 40
          timeout: 10000
      - scrollUntilVisible:
          element:
            id: "mermaid-diagram"
          direction: DOWN
          visibilityPercentage: 100
          speed: 20
          timeout: 10000
      - tapOn:
          id: "mermaid-diagram"
      - extendedWaitUntil:
          visible:
            id: "mermaid-viewer"
          timeout: 5000
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: "mermaid-viewer-preview"
    timeout: 10000
- takeScreenshot: mermaid-viewer
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${DIAGRAM_CLOSE}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "mermaid-diagram"
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${IMAGE_SESSION_TITLE}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${IMAGE_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${IMAGE_NAME}
          timeout: 10000
- tapOn: ${IMAGE_NAME}
- extendedWaitUntil:
    visible:
      id: "image-viewer"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: image-viewer
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${IMAGE_CLOSE}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: ${IMAGE_NAME}
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- scrollUntilVisible:
    element: ${SEND_SESSION_TITLE}
    direction: UP
    centerElement: true
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SEND_SESSION_TITLE}
      - extendedWaitUntil:
          visible:
            id: "composer-input"
          timeout: 10000
- assertVisible: ${ATTACH_ACTION}
- tapOn:
    id: "composer-input"
- inputText: ${SEND_PROMPT}
- tapOn: ${SEND_ACTION}
- extendedWaitUntil:
    visible: ${SEND_REPLY}
    timeout: 20000
- assertNotVisible: ${REPLYING_STATUS}
- takeScreenshot: session-streaming
- extendedWaitUntil:
    visible: ${SEND_REPLY_END}
    timeout: 20000
- assertNotVisible: ${REPLYING_STATUS}
- assertVisible: ${SEND_REPLY_CODE}
- assertVisible: ${SEND_PROMPT}
- tapOn: ${SEND_REPLY}
- waitForAnimationToEnd
- takeScreenshot: session-reply
- tapOn:
    id: "session-config-chip"
- extendedWaitUntil:
    visible:
      id: "session-config-model"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: session-config
- tapOn:
    id: "session-config-model"
- scrollUntilVisible:
    element:
      id: "session-config-model-${AGENT_MODEL_ID}"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: session-config-model
- tapOn:
    id: "session-config-model-${AGENT_MODEL_ID}"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "session-config-save-role"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "session-config-save-role"
- extendedWaitUntil:
    visible:
      id: "save-role-name"
    timeout: 10000
- inputText: "E2E Reviewer"
- waitForAnimationToEnd
- takeScreenshot: save-role
- tapOn: ${SAVE_ROLE_SAVE}
- extendedWaitUntil:
    visible:
      id: "session-config-save-role"
    timeout: 10000
- tapOn: ${SESSION_CONFIG_CLOSE}
- extendedWaitUntil:
    visible:
      id: "session-config-chip"
      text: "(?s).*${NEW_SESSION_MODEL}.*"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          while:
            visible:
              id: "composer-input"
          times: 2
          commands:
            - back
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${NEW_SESSION_ACTION}
      - extendedWaitUntil:
          visible:
            id: "new-session-prompt"
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-session
- tapOn:
    id: "new-session-agent"
- extendedWaitUntil:
    visible:
      id: "new-session-workspace"
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: "new-session-workspace"
- extendedWaitUntil:
    visible:
      id: "workspace-choice-.*"
    timeout: 5000
- tapOn:
    id: "workspace-choice-.*"
- extendedWaitUntil:
    visible:
      id: "new-session-agent-row"
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: "new-session-agent-row"
- scrollUntilVisible:
    element:
      id: "new-session-agent-pi"
    timeout: 5000
- tapOn:
    id: "new-session-agent-pi"
- extendedWaitUntil:
    visible:
      id: "new-session-model"
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: "new-session-model"
- scrollUntilVisible:
    element:
      id: "new-session-model-${AGENT_MODEL_ID}"
    timeout: 5000
- tapOn:
    id: "new-session-model-${AGENT_MODEL_ID}"
- extendedWaitUntil:
    visible:
      id: "new-session-role"
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: "new-session-role"
- scrollUntilVisible:
    element:
      id: "new-session-role-${ROLE_ID}"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: role-sheet
- tapOn:
    id: "new-session-role-${ROLE_ID}"
- extendedWaitUntil:
    visible:
      id: "new-session-role"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: new-session-agent
- tapOn: ${SESSION_CONFIG_CLOSE}
- extendedWaitUntil:
    visible:
      id: "new-session-prompt"
    timeout: 5000
- assertVisible:
    id: "new-session-agent"
    text: "(?s).*${ROLE_NAME}.*"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${NEW_SESSION_ACTION}
    timeout: 10000
- tapOn: ${NEW_SESSION_ACTION}
- extendedWaitUntil:
    visible:
      id: "new-session-agent"
      text: "(?s).*${ROLE_NAME}.*"
    timeout: 10000
- tapOn:
    id: "new-session-agent"
- extendedWaitUntil:
    visible:
      id: "new-session-workspace"
      text: "(?s).*${WORKSPACE_NAME}.*"
    timeout: 5000
- assertVisible:
    id: "new-session-model"
    text: "(?s).*${NEW_SESSION_MODEL}.*"
- takeScreenshot: new-session-restored
- tapOn: ${SESSION_CONFIG_CLOSE}
- extendedWaitUntil:
    visible:
      id: "new-session-prompt"
    timeout: 5000
- tapOn:
    id: "new-session-prompt"
- inputText: ${NEW_SESSION_PROMPT}
- takeScreenshot: new-session-filled
- tapOn: ${SEND_ACTION}
- extendedWaitUntil:
    visible: ${SEND_REPLY}
    timeout: 20000
- assertVisible: ${NEW_SESSION_PROMPT}
- waitForAnimationToEnd
- takeScreenshot: new-session-reply
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: ${TAB_SESSIONS}
            - extendedWaitUntil:
                visible: ${WORKSPACE_NAME}
                timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 3
          commands:
            - swipe:
                start: 50%, 35%
                end: 50%, 85%
      - waitForAnimationToEnd
- tapOn: ${SEARCH_OPEN}
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ${SEARCH_PLACEHOLDER}
- inputText: ${SEARCH_QUERY}
- extendedWaitUntil:
    visible: ${SEARCHED_SESSION_TITLE}
    timeout: 5000
- assertNotVisible: ${OTHER_SESSION_TITLE}
- waitForAnimationToEnd
- takeScreenshot: sessions-search
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SEARCHED_SESSION_TITLE}
      - extendedWaitUntil:
          visible: ${SEARCHED_SESSION_LAST_PROMPT}
          timeout: 10000
- assertVisible:

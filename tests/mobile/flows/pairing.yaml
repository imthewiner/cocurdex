- waitForAnimationToEnd
- takeScreenshot: issue-move
- tapOn:
    id: issue-move-done
- extendedWaitUntil:
    notVisible: ${IN_PROGRESS_ISSUE_TITLE}
    timeout: 10000
- scrollUntilVisible:
    element:
      id: issue-section-done
    direction: DOWN
- tapOn:
    id: issue-section-done
- scrollUntilVisible:
    element: ${IN_PROGRESS_ISSUE_TITLE}
    direction: DOWN
- longPressOn: ${IN_PROGRESS_ISSUE_TITLE}
- extendedWaitUntil:
    visible:
      id: issue-move-doing

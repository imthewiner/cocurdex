name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_desktop: ${{ steps.verified.outputs.hit != 'true' && steps.scope.outputs.run_desktop || 'false' }}
      run_mobile: ${{ steps.verified.outputs.hit != 'true' && steps.scope.outputs.run_mobile || 'false' }}
      seed_mobile: ${{ steps.scope.outputs.seed_mobile }}
      verified: ${{ steps.verified.outputs.hit == 'true' }}
      verified_key: ${{ steps.fingerprint.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fingerprint verified inputs
        id: fingerprint
        run: |
          excluded='(^|/)(AGENTS|CLAUDE)[.]md$|^[^/]+[.]md$|^docs/|^[.](agents|claude|cursor)/.*[.]md$'
          fingerprint="$({
            git ls-tree -r HEAD |
              awk -F'\t' -v excluded="${excluded}" '$2 !~ excluded && $2 != "apps/desktop/package.json"'
            git show HEAD:apps/desktop/package.json | grep -v '^  "version":' | git hash-object --stdin
          } | git hash-object --stdin)"
          echo "key=ci-verified-v1-${fingerprint}" >> "${GITHUB_OUTPUT}"
      - name: Look up verified fingerprint
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.fingerprint.outputs.key }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          matches="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${KEY}&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == ${REPOSITORY_ID})] | length" \
            || echo 0)"
          if [[ "${matches}" -gt 0 ]]; then
            echo "hit=true" >> "${GITHUB_OUTPUT}"
          else
            echo "hit=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install workspace tools
        run: pnpm install --frozen-lockfile --filter @cocurdex/workspace
      - name: Detect affected packages
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
            head="${GITHUB_SHA}"
          fi

          everything=false
          affected=""
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            everything=true
          else
            if git diff --name-only "${base}...${head}" | grep -q '^[.]github/'; then
              everything=true
            fi
            affected="$(TURBO_SCM_BASE="${base}" TURBO_SCM_HEAD="${head}" \
              pnpm exec turbo ls --affected --output=json | jq -r '.packages.items[].name')"
          fi
          echo "Affected packages:"
          echo "${affected:-(none)}"

          mobile_only='^@cocurdex/(console|mobile|mobile-e2e|unit-mobile)$'
          desktop_affected=false
          if grep -v -E "${mobile_only}" <<< "${affected}" | grep -q .; then
            desktop_affected=true
          fi
          mobile_affected=false
          if grep -qx '@cocurdex/mobile-e2e' <<< "${affected}"; then
            mobile_affected=true
          fi
          if [[ "${everything}" == "true" ]]; then
            desktop_affected=true
            mobile_affected=true
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            run_desktop="${desktop_affected}"
            run_mobile="${mobile_affected}"
            seed_mobile=false
          else
            run_desktop=true
            run_mobile=false
            seed_mobile="${mobile_affected}"
          fi
          {
            echo "run_desktop=${run_desktop}"
            echo "run_mobile=${run_mobile}"
            echo "seed_mobile=${seed_mobile}"
          } >> "${GITHUB_OUTPUT}"

  workspace:
    name: Workspace quality
    needs: changes
    if: needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Restore pnpm store
        uses: ./.github/actions/restore-pnpm-store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - name: Typecheck and test
        run: pnpm exec turbo run typecheck test --filter "!@cocurdex/e2e" --concurrency 4 --continue
      - name: Test e2e
        if: ${{ !cancelled() }}
        run: pnpm exec turbo run test --filter @cocurdex/e2e
      - name: Check design tokens
        run: pnpm lint:design-tokens
      - name: Check theme parity
        run: pnpm lint:theme-parity
      - name: Check mobile theme colors are up to date
        run: pnpm --filter @cocurdex/mobile check:theme-colors
      - name: Check mobile mermaid runtime is up to date
        run: pnpm --filter @cocurdex/mobile check:mermaid-runtime
      - name: Check mobile note editor runtime is up to date
        run: pnpm --filter @cocurdex/mobile check:note-editor-runtime
      - name: Check desktop translations
        run: pnpm --filter @cocurdex/desktop i18n:lint
      - name: Check mobile translations
        run: pnpm --filter @cocurdex/mobile i18n:lint
      - name: Check i18n generated files are up to date
        run: |
          for app in desktop mobile; do
            pnpm --filter "@cocurdex/${app}" i18n:extract
            pnpm --filter "@cocurdex/${app}" i18n:types
          done
          paths=(apps/desktop/src/locales apps/desktop/src/i18n apps/mobile/src/locales apps/mobile/src/i18n)
          pnpm exec biome check --write "${paths[@]}"
          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            git status --short -- "${paths[@]}"
            git diff -- "${paths[@]}" | head -200
            echo "::error::i18n generated files are stale. Run 'pnpm --filter @cocurdex/<app> i18n:extract' and 'i18n:types' for desktop and mobile, then 'pnpm exec biome check --write' on their src/locales and src/i18n, and commit the result."
            exit 1
          fi
      - name: Check desktop dependency cycles
        run: pnpm --filter @cocurdex/desktop lint:cycles
      - name: Lint renderer structure rules
        run: pnpm exec biome lint --only=style/noRestrictedImports --only=performance/noReExportAll --only=plugin apps/desktop/src
      - name: Prune turbo cache
        if: ${{ !cancelled() }}
        shell: bash
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
      - name: Upload turbo cache
        if: ${{ !cancelled() && hashFiles('.turbo/cache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    runs-on: ${{ needs.changes.outputs.run_desktop == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        if: needs.changes.outputs.run_desktop == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        if: needs.changes.outputs.run_desktop == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        if: needs.changes.outputs.run_desktop == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Restore pnpm store
        if: needs.changes.outputs.run_desktop == 'true'
        uses: ./.github/actions/restore-pnpm-store
      - name: Install native build tools
        if: needs.changes.outputs.run_desktop == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - name: Install dependencies
        if: needs.changes.outputs.run_desktop == 'true'
        run: pnpm install --frozen-lockfile
      - name: Restore turbo cache
        if: needs.changes.outputs.run_desktop == 'true' && runner.os != 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - name: Test all packages
        if: needs.changes.outputs.run_desktop == 'true' && runner.os != 'Linux'
        run: pnpm exec turbo run test --filter "!@cocurdex/e2e" --concurrency 4 --continue
      - name: Test e2e
        if: ${{ !cancelled() && needs.changes.outputs.run_desktop == 'true' && runner.os != 'Linux' }}
        run: pnpm exec turbo run test --filter @cocurdex/e2e
        env:
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-tests
      - name: Build desktop
        if: needs.changes.outputs.run_desktop == 'true'
        run: pnpm --filter @cocurdex/desktop build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Test built desktop startup
        if: needs.changes.outputs.run_desktop == 'true' && runner.os != 'Linux'
        run: pnpm --filter @cocurdex/e2e test:desktop
        env:
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-tests
      - name: Test built desktop startup on Linux
        if: needs.changes.outputs.run_desktop == 'true' && runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @cocurdex/e2e test:desktop
        env:
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-tests
      - name: Configure Electron sandbox
        if: needs.changes.outputs.run_desktop == 'true' && runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('electron')), 'dist', 'chrome-sandbox')")"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Test desktop UI scenarios
        if: needs.changes.outputs.run_desktop == 'true' && runner.os == 'Linux'
        run: xvfb-run -a pnpm test:ui
        env:
          COCURDEX_SCENARIO_RENDERER: built
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-tests
      - name: Check startup bundle budget
        if: needs.changes.outputs.run_desktop == 'true'
        run: pnpm --filter @cocurdex/desktop check:startup-bundle
      - name: Upload desktop test artifacts
        if: ${{ !cancelled() && needs.changes.outputs.run_desktop == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-tests
          if-no-files-found: ignore
          retention-days: 7
      - name: Prune turbo cache
        if: ${{ !cancelled() && needs.changes.outputs.run_desktop == 'true' && runner.os != 'Linux' }}
        shell: bash
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
      - name: Upload turbo cache
        if: ${{ !cancelled() && needs.changes.outputs.run_desktop == 'true' && runner.os != 'Linux' && hashFiles('.turbo/cache/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}

  mobile-app:
    name: Mobile app (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.run_mobile == 'true' || needs.changes.outputs.seed_mobile == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-latest
          - platform: android
            os: ubuntu-latest
    env:
      NATIVE_DIR: ${{ github.workspace }}/../mobile-native
      APP_DIR: ${{ github.workspace }}/../mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21
      - name: Restore pnpm store
        uses: ./.github/actions/restore-pnpm-store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fingerprint native app
        id: fingerprint
        working-directory: tests/mobile
        run: echo "hash=$(node --import tsx app.ts fingerprint --platform ${{ matrix.platform }})" >> "${GITHUB_OUTPUT}"
      - name: Restore native app
        id: native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.NATIVE_DIR }}
          key: mobile-native-v1-${{ matrix.platform }}-${{ steps.fingerprint.outputs.hash }}
          lookup-only: ${{ needs.changes.outputs.run_mobile != 'true' }}
      - name: Build native app
        if: steps.native.outputs.cache-hit != 'true'
        run: pnpm --filter @cocurdex/mobile-e2e app -- build --platform ${{ matrix.platform }} --out "${NATIVE_DIR}"
      - name: Save native app
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.NATIVE_DIR }}
          key: mobile-native-v1-${{ matrix.platform }}-${{ steps.fingerprint.outputs.hash }}
      - name: Delete older native apps
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: mobile-native-v1-${{ matrix.platform }}-${{ steps.fingerprint.outputs.hash }}
        run: |
          gh cache list --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" \
            --key "mobile-native-v1-${{ matrix.platform }}-" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"${KEEP}\") | .id" |
            while read -r id; do gh cache delete "${id}" --repo "${GITHUB_REPOSITORY}"; done
      - name: Repack current JavaScript
        if: needs.changes.outputs.run_mobile == 'true' && steps.native.outputs.cache-hit == 'true'
        run: |
          app="$(ls "${NATIVE_DIR}")"
          pnpm --filter @cocurdex/mobile-e2e app -- repack --platform ${{ matrix.platform }} \
            --source "${NATIVE_DIR}/${app}" --out "${APP_DIR}"
      - name: Use fresh native app
        if: needs.changes.outputs.run_mobile == 'true' && steps.native.outputs.cache-hit != 'true'
        run: |
          rm -rf "${APP_DIR}"
          cp -R "${NATIVE_DIR}" "${APP_DIR}"
      - name: Archive app
        if: needs.changes.outputs.run_mobile == 'true'
        run: tar -C "${APP_DIR}" -cf "${RUNNER_TEMP}/mobile-app.tar" .
      - name: Upload app
        if: needs.changes.outputs.run_mobile == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-app-${{ matrix.platform }}
          path: ${{ runner.temp }}/mobile-app.tar
          retention-days: 1

  mobile:
    name: Mobile e2e (${{ matrix.platform }}, ${{ matrix.run }})
    needs: [changes, mobile-app]
    if: needs.changes.outputs.run_mobile == 'true'
    runs-on: ${{ matrix.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
        run: [light-en-US, dark-zh-CN]
    env:
      MAESTRO_VERSION: 2.11.0
      ANDROID_SYSTEM_IMAGE: system-images;android-36;google_apis;x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21
      - name: Restore pnpm store
        uses: ./.github/actions/restore-pnpm-store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mobile-app-${{ matrix.platform }}
          path: ${{ runner.temp }}
      - name: Unpack app
        id: app
        run: |
          mkdir -p "${RUNNER_TEMP}/mobile-app"
          tar -C "${RUNNER_TEMP}/mobile-app" -xf "${RUNNER_TEMP}/mobile-app.tar"
          echo "path=${RUNNER_TEMP}/mobile-app/$(ls "${RUNNER_TEMP}/mobile-app")" >> "${GITHUB_OUTPUT}"
      - name: Build bundled daemon
        run: pnpm --filter @cocurdex/desktop prepare:cli
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "${HOME}/.maestro/bin" >> "${GITHUB_PATH}"
      - name: Enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create Android emulator
        if: matrix.platform == 'android'
        run: |
          tools="${ANDROID_HOME}/cmdline-tools/latest/bin"
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "${GITHUB_ENV}"
          yes | "${tools}/sdkmanager" --licenses > /dev/null
          "${tools}/sdkmanager" emulator platform-tools "${ANDROID_SYSTEM_IMAGE}"
          echo no | "${tools}/avdmanager" create avd --force --name cocurdex-ci --package "${ANDROID_SYSTEM_IMAGE}" --device pixel_6
      - name: Run mobile flows
        run: |
          avd=()
          if [[ "${{ matrix.platform }}" == "android" ]]; then
            avd=(--avd cocurdex-ci)
          fi
          pnpm --filter @cocurdex/mobile-e2e flows -- --platform ${{ matrix.platform }} \
            --app "${{ steps.app.outputs.path }}" --run ${{ matrix.run }} "${avd[@]}"
        env:
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/mobile-tests
      - name: Upload mobile test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-tests-${{ matrix.platform }}-${{ matrix.run }}
          path: ${{ runner.temp }}/mobile-tests
          if-no-files-found: ignore
          retention-days: 7

  pnpm-store:
    name: Cache pnpm store (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Locate pnpm store
        id: store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Look up cached pnpm store
        id: cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          lookup-only: true
      - name: Fetch dependencies
        if: steps.cached.outputs.cache-hit != 'true'
        run: pnpm fetch
      - name: Save pnpm store
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Delete older pnpm stores
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        run: |
          gh cache list --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" \
            --key "pnpm-store-${RUNNER_OS}-" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"${KEEP}\") | .id" |
            while read -r id; do gh cache delete "${id}" --repo "${GITHUB_REPOSITORY}"; done

  record:
    name: Record verified fingerprint
    needs: [changes, workspace, desktop, mobile-app, mobile]
    if: ${{ !cancelled() && needs.changes.outputs.verified != 'true' && needs.workspace.result == 'success' && needs.desktop.result == 'success' && needs.mobile-app.result != 'failure' && needs.mobile.result != 'failure' && needs.changes.outputs.run_desktop == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write marker
        run: echo "${GITHUB_SHA}" > ci-verified.txt
      - name: Save verified fingerprint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ needs.changes.outputs.verified_key }}
          path: ci-verified.txt
          retention-days: 30

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  changes:
    name: Detect desktop changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_desktop: ${{ steps.verified.outputs.hit != 'true' && steps.scope.outputs.run_desktop || 'false' }}
      run_mobile: ${{ steps.verified.outputs.hit != 'true' && steps.scope.outputs.run_mobile || 'false' }}
      verified: ${{ steps.verified.outputs.hit == 'true' }}
      verified_key: ${{ steps.fingerprint.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fingerprint verified inputs
        id: fingerprint
        run: |
          excluded='(^|/)(AGENTS|CLAUDE)[.]md$|^[^/]+[.]md$|^docs/|^[.](agents|claude|cursor)/.*[.]md$'
          fingerprint="$({
            git ls-tree -r HEAD |
              awk -F'\t' -v excluded="${excluded}" '$2 !~ excluded && $2 != "apps/desktop/package.json"'
            git show HEAD:apps/desktop/package.json | grep -v '^  "version":' | git hash-object --stdin
          } | git hash-object --stdin)"
          echo "key=ci-verified-v1-${fingerprint}" >> "${GITHUB_OUTPUT}"
      - name: Look up verified fingerprint
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.fingerprint.outputs.key }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          matches="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${KEY}&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == ${REPOSITORY_ID})] | length" \
            || echo 0)"
          if [[ "${matches}" -gt 0 ]]; then
            echo "hit=true" >> "${GITHUB_OUTPUT}"
          else
            echo "hit=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Detect desktop scope
        id: scope
        if: steps.verified.outputs.hit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "run_desktop=true" >> "${GITHUB_OUTPUT}"
            echo "run_mobile=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          run_desktop=false
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/workflows/ci.yml|.npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json|tsconfig.json|apps/cli/*|apps/desktop/*|packages/agent-adapters/*|packages/agent-core/*|packages/client-runtime/*|packages/daemon/*|packages/db/*|packages/llm-chat/*|packages/product-skills/*|packages/rpc/*|packages/shared/*|tests/*)
                run_desktop=true
                break
                ;;
            esac
          done <<< "${changed_files}"

          run_mobile=false
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/workflows/ci.yml|apps/mobile/*|packages/client-runtime/*|packages/rpc/*|packages/shared/*|tests/mobile/*)
                run_mobile=true
                break
                ;;
            esac
          done <<< "${changed_files}"

          echo "run_desktop=${run_desktop}" >> "${GITHUB_OUTPUT}"
          echo "run_mobile=${run_mobile}" >> "${GITHUB_OUTPUT}"

  workspace:
    name: Workspace quality
    needs: changes
    if: needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Restore pnpm store
        uses: ./.github/actions/restore-pnpm-store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm -r --no-bail --if-present --filter "!@cocurdex/e2e" test
      - name: Test e2e
        if: ${{ !cancelled() }}
        run: pnpm --filter @cocurdex/e2e test
      - name: Check design tokens
        run: pnpm lint:design-tokens
      - name: Check theme parity
        run: pnpm lint:theme-parity
      - name: Check mobile theme colors are up to date
        run: pnpm --filter @cocurdex/mobile check:theme-colors
      - name: Check mobile mermaid runtime is up to date
        run: pnpm --filter @cocurdex/mobile check:mermaid-runtime
      - name: Check mobile note editor runtime is up to date
        run: pnpm --filter @cocurdex/mobile check:note-editor-runtime
      - name: Bundle mobile app
        working-directory: apps/mobile
        run: |
          pnpm exec expo export --platform ios --output-dir "${RUNNER_TEMP}/mobile-ios"
          pnpm exec expo export --platform android --output-dir "${RUNNER_TEMP}/mobile-android"
      - name: Check desktop translations
        run: pnpm --filter @cocurdex/desktop i18n:lint
      - name: Check mobile translations
        run: pnpm --filter @cocurdex/mobile i18n:lint
      - name: Check i18n generated files are up to date
        run: |
          for app in desktop mobile; do
            pnpm --filter "@cocurdex/${app}" i18n:extract
            pnpm --filter "@cocurdex/${app}" i18n:types
          done
          paths=(apps/desktop/src/locales apps/desktop/src/i18n apps/mobile/src/locales apps/mobile/src/i18n)
          pnpm exec biome check --write "${paths[@]}"
          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            git status --short -- "${paths[@]}"
            git diff -- "${paths[@]}" | head -200
            echo "::error::i18n generated files are stale. Run 'pnpm --filter @cocurdex/<app> i18n:extract' and 'i18n:types' for desktop and mobile, then 'pnpm exec biome check --write' on their src/locales and src/i18n, and commit the result."
            exit 1
          fi
      - name: Check desktop dependency cycles
        run: pnpm --filter @cocurdex/desktop lint:cycles
      - name: Lint renderer structure rules
        run: pnpm exec biome lint --only=style/noRestrictedImports --only=performance/noReExportAll --only=plugin apps/desktop/src

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    runs-on: ${{ needs.changes.outputs.run_desktop == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        if: needs.changes.outputs.run_desktop == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        if: needs.changes.outputs.run_desktop == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        if: needs.changes.outputs.run_desktop == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Restore pnpm store
        if: needs.changes.outputs.run_desktop == 'true'
        uses: ./.github/actions/restore-pnpm-store
      - name: Install native build tools
        if: needs.changes.outputs.run_desktop == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - name: Install dependencies
        if: needs.changes.outputs.run_desktop == 'true'
        run: pnpm install --frozen-lockfile
      - name: Typecheck desktop
        if: needs.changes.outputs.run_desktop == 'true'
        run: pnpm --filter @cocurdex/desktop --filter @cocurdex/unit-desktop typecheck
      - name: Test desktop
        if: needs.changes.outputs.run_desktop == 'true' && runner.os == 'Linux'
        run: pnpm --filter @cocurdex/unit-desktop test
      - name: Test all packages
        if: needs.changes.outputs.run_desktop == 'true' && runner.os != 'Linux'
        run: pnpm -r --no-bail --if-present --filter "!@cocurdex/e2e" test
      - name: Test e2e
        if: ${{ !cancelled() && needs.changes.outputs.run_desktop == 'true' && runner.os != 'Linux' }}
        run: pnpm --filter @cocurdex/e2e test
        env:
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-tests
      - name: Build desktop
        if: needs.changes.outputs.run_desktop == 'true'
        run: pnpm --filter @cocurdex/desktop build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Test built desktop startup
        if: needs.changes.outputs.run_desktop == 'true' && runner.os != 'Linux'
        run: pnpm --filter @cocurdex/e2e test:desktop
        env:
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-tests
      - name: Test built desktop startup on Linux
        if: needs.changes.outputs.run_desktop == 'true' && runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @cocurdex/e2e test:desktop
        env:
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-tests
      - name: Configure Electron sandbox
        if: needs.changes.outputs.run_desktop == 'true' && runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('electron')), 'dist', 'chrome-sandbox')")"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Test desktop UI scenarios
        if: needs.changes.outputs.run_desktop == 'true' && runner.os == 'Linux'
        run: xvfb-run -a pnpm test:ui
        env:
          COCURDEX_SCENARIO_RENDERER: built
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-tests
      - name: Check startup bundle budget
        if: needs.changes.outputs.run_desktop == 'true'
        run: pnpm --filter @cocurdex/desktop check:startup-bundle
      - name: Upload desktop test artifacts
        if: ${{ !cancelled() && needs.changes.outputs.run_desktop == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-tests
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile e2e (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.run_mobile == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-latest
          - platform: android
            os: ubuntu-latest
    env:
      MAESTRO_VERSION: 2.11.0
      ANDROID_SYSTEM_IMAGE: system-images;android-36;google_apis;x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21
      - name: Restore pnpm store
        uses: ./.github/actions/restore-pnpm-store
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "${HOME}/.maestro/bin" >> "${GITHUB_PATH}"
      - name: Enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create Android emulator
        if: matrix.platform == 'android'
        run: |
          tools="${ANDROID_HOME}/cmdline-tools/latest/bin"
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}" >> "${GITHUB_ENV}"
          yes | "${tools}/sdkmanager" --licenses > /dev/null
          "${tools}/sdkmanager" emulator platform-tools "${ANDROID_SYSTEM_IMAGE}"
          echo no | "${tools}/avdmanager" create avd --force --name cocurdex-ci --package "${ANDROID_SYSTEM_IMAGE}" --device pixel_6
      - name: Run mobile flows
        run: pnpm --filter @cocurdex/mobile-e2e flows -- --platform ${{ matrix.platform }} --build ${{ matrix.platform == 'android' && '--avd cocurdex-ci' || '' }}
        env:
          COCURDEX_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/mobile-tests
      - name: Upload mobile test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-tests-${{ matrix.platform }}
          path: ${{ runner.temp }}/mobile-tests
          if-no-files-found: ignore
          retention-days: 7

  pnpm-store:
    name: Cache pnpm store (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Locate pnpm store
        id: store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"
      - name: Look up cached pnpm store
        id: cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          lookup-only: true
      - name: Fetch dependencies
        if: steps.cached.outputs.cache-hit != 'true'
        run: pnpm fetch
      - name: Save pnpm store
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  record:
    name: Record verified fingerprint
    needs: [changes, workspace, desktop, mobile]
    if: ${{ !cancelled() && needs.changes.outputs.verified != 'true' && needs.workspace.result == 'success' && needs.desktop.result == 'success' && needs.mobile.result != 'failure' && needs.changes.outputs.run_desktop == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write marker
        run: echo "${GITHUB_SHA}" > ci-verified.txt
      - name: Save verified fingerprint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ needs.changes.outputs.verified_key }}
          path: ci-verified.txt
          retention-days: 30
